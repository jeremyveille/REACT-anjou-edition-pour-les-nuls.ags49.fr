name: Intégration Continue (CI) - Tests & Validation

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches-ignore:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    name: Validation CI (Jest & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: 📦 Installation des dépendances (app/)
        working-directory: app
        run: npm ci

      - name: 🧪 Exécution des tests automatisés (Jest)
        working-directory: app
        env:
          CI: "true"
        run: npm test

      - name: 🏗️ Compilation de production (React Build)
        working-directory: app
        run: npm run build
